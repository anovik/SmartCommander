name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore src/SmartCommander/SmartCommander.csproj
      - name: Publish (framework-dependent, win-x64)
        run: >
          dotnet publish src/SmartCommander/SmartCommander.csproj --configuration Release
          -r win-x64 --self-contained false -o publish/win-x64
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\SmartCommander_Windows.iss'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/Output/SmartCommander_setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish (framework-dependent, linux-x64)
        run: >
          dotnet publish src/SmartCommander/SmartCommander.csproj --configuration Release
          -r linux-x64 --self-contained false -o publish/linux-x64
      - name: Build AppImage
        run: |
          chmod +x installers/linux/build-appimage.sh
          installers/linux/build-appimage.sh "$(pwd)/publish/linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: installers/linux/SmartCommander-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    # Manual (workflow_dispatch) runs only build the two artifacts for inspection/testing;
    # only an actual tag push creates a GitHub Release, and it's created as a draft
    # (empty notes) so the notes can be written by hand before publishing.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          files: |
            artifacts/windows-installer/SmartCommander_setup.exe
            artifacts/linux-appimage/SmartCommander-x86_64.AppImage
